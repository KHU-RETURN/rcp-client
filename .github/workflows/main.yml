name: CI/CD Deployment

on:
  push:
    branches: ["main"] # main 브랜치에 push하면 작동

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build # 본인의 빌드 명령어 확인

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 빌드 결과물이 나오는 폴더 (build 또는 dist)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
