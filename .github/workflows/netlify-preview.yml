name: Netlify Preview

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: netlify-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview/pr-${{ github.event.pull_request.number }}
      url: ${{ steps.preview.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
      PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL }}
      VITE_RCP_API_BASE_URL: ''
      VITE_RCP_DEMO_MODE: ${{ vars.VITE_RCP_DEMO_MODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Validate preview configuration
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "::error::Missing NETLIFY_AUTH_TOKEN secret" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "::error::Missing NETLIFY_SITE_ID secret" && exit 1)
          test -n "$NETLIFY_SITE_NAME" || (echo "::error::Missing NETLIFY_SITE_NAME repository variable" && exit 1)
          test -n "$PREVIEW_API_BASE_URL" || (echo "::error::Missing PREVIEW_API_BASE_URL repository variable" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add Netlify redirects
        run: |
          preview_api_base_url="${PREVIEW_API_BASE_URL%/}"
          {
            printf "/api/*  %s/api/:splat  200!\\n" "$preview_api_base_url"
            printf "/*      /index.html         200\\n"
          } > dist/_redirects

      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@23 deploy \
            --dir=dist \
            --no-build \
            --json \
            --alias="pr-${{ github.event.pull_request.number }}" \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" > netlify-deploy.json

      - name: Resolve preview deployment
        id: preview
        run: |
          preview_url="https://pr-${{ github.event.pull_request.number }}--${NETLIFY_SITE_NAME}.netlify.app"
          deploy_id="$(node -e "const fs = require('node:fs'); const deploy = JSON.parse(fs.readFileSync('netlify-deploy.json', 'utf8')); console.log(deploy.deploy_id || deploy.id || '');")"
          test -n "$deploy_id" || (echo "::error::Could not resolve Netlify deploy id" && exit 1)
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          NETLIFY_DEPLOY_ID: ${{ steps.preview.outputs.deploy_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- rcp-netlify-preview -->';
            const deployMarker = `<!-- netlify-deploy-id:${process.env.NETLIFY_DEPLOY_ID} -->`;
            const body = [
              marker,
              deployMarker,
              `**Preview site:** ${process.env.PREVIEW_URL}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup PR preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}

    steps:
      - name: Cleanup Netlify deployment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rcp-netlify-preview -->';
            const deployIdPattern = /<!-- netlify-deploy-id:([^ ]+) -->/;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const aliasHost = `pr-${context.payload.pull_request.number}--${process.env.NETLIFY_SITE_NAME}.netlify.app`;
            const headers = {
              Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            };

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            const deployId = previous?.body?.match(deployIdPattern)?.[1];

            if (
              !process.env.NETLIFY_AUTH_TOKEN ||
              !process.env.NETLIFY_SITE_ID ||
              !process.env.NETLIFY_SITE_NAME
            ) {
              throw new Error(
                'Missing NETLIFY_AUTH_TOKEN secret, NETLIFY_SITE_ID secret, or NETLIFY_SITE_NAME repository variable.',
              );
            }

            const deployIds = new Set(deployId ? [deployId] : []);

            for (let page = 1; page <= 5; page += 1) {
              const response = await fetch(
                `https://api.netlify.com/api/v1/sites/${process.env.NETLIFY_SITE_ID}/deploys?per_page=100&page=${page}`,
                { headers },
              );
              if (!response.ok) {
                const text = await response.text();
                throw new Error(`Netlify deploy lookup failed: ${response.status} ${text}`);
              }

              const deploys = await response.json();
              if (!Array.isArray(deploys) || deploys.length === 0) break;

              for (const deploy of deploys) {
                const urls = [
                  deploy.ssl_url,
                  deploy.url,
                  deploy.deploy_ssl_url,
                  deploy.deploy_url,
                ].filter(Boolean);
                if (urls.some((url) => url.includes(aliasHost))) {
                  deployIds.add(deploy.id);
                }
              }
            }

            if (deployIds.size === 0) {
              core.warning('No matching Netlify preview deploys found.');
              return;
            }

            const deletedDeployIds = [];
            for (const id of deployIds) {
              const response = await fetch(
                `https://api.netlify.com/api/v1/sites/${process.env.NETLIFY_SITE_ID}/deploys/${id}`,
                {
                  method: 'DELETE',
                  headers,
                },
              );

              if (!response.ok && response.status !== 404) {
                const text = await response.text();
                throw new Error(`Netlify deploy deletion failed: ${response.status} ${text}`);
              }
              deletedDeployIds.push(id);
            }

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body: [
                  marker,
                  '**Preview site:** removed',
                  '',
                  `Cleaned up Netlify deploys: ${deletedDeployIds.map((id) => `\`${id}\``).join(', ')}`,
                ].join('\n'),
              });
            }
